server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    default: native
  cloud:
    config:
      server:
        accept-empty: false
        native:
          search-locations:
            - file:../config-repo

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
